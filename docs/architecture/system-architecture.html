<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴스·댓글 NLP 파이프라인</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222938;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;display:flex;justify-content:center;padding:36px 24px}.frame{width:min(1500px,100%);overflow-x:auto}.eyebrow{font-size:11px;letter-spacing:.18em;color:#667085;margin:0 0 7px}.title{font-size:29px;letter-spacing:-.04em;margin:0 0 7px}.lead{font-size:13px;color:#667085;margin:0 0 18px}.note{border-top:1px solid #d8dce3;margin-top:16px;padding-top:12px;color:#596275;font-size:12px;line-height:1.65}svg{display:block;width:100%;min-width:1320px}.lane{fill:#fff;stroke:#d0d5dd;stroke-width:1}.lane-batch{fill:#fffaf7;stroke:#efb08f}.lane-stream{fill:#f7f9fc;stroke:#a8bdd2}.node{fill:#fff;stroke:#667085;stroke-width:1.1}.source{fill:#f8fafc;stroke:#667085}.process{fill:#fff4ee;stroke:#e86c34;stroke-width:1.4}.store{fill:#edf8f2;stroke:#4b8c69}.control{fill:#eef5fc;stroke:#3974aa}.observe{fill:#f5f0fb;stroke:#7c5aa6}.error-node{fill:#fff0ef;stroke:#c84d49}.future{fill:#f5f5f5;stroke:#9299a8;stroke-dasharray:6 4}.lane-title{font-size:13px;font-weight:700;fill:#222938}.lane-sub{font-size:9px;fill:#667085}.label{font-size:8px;letter-spacing:.09em;fill:#667085}.name{font-size:12px;font-weight:650;fill:#222938}.sub{font-size:8.5px;fill:#596275}.arrow{stroke:#596579;stroke-width:1.25;fill:none;marker-end:url(#arrow)}.batch-flow{stroke:#e86c34;stroke-width:1.55;fill:none;marker-end:url(#accent)}.stream-flow{stroke:#3974aa;stroke-width:1.35;fill:none;marker-end:url(#blue)}.control-flow{stroke:#3974aa;stroke-width:1.2;stroke-dasharray:8 3 2 3;fill:none;marker-end:url(#blue)}.error-flow{stroke:#c84d49;stroke-width:1.3;stroke-dasharray:3 3;fill:none;marker-end:url(#red)}.future-flow{stroke:#9299a8;stroke-width:1.2;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow)}.legend{font-size:8.5px;fill:#596275}.metric{font-size:8px;font-weight:650;fill:#3974aa}
</style>
</head>
<body><main class="frame">
<p class="eyebrow">SYSTEM ARCHITECTURE</p>
<h1 class="title">뉴스·댓글 NLP 파이프라인</h1>
<p class="lead">현재 end-to-end Airflow 배치 경로와 독립적으로 검증한 Kafka 재생·스트리밍 경로</p>
<svg viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">뉴스 댓글 NLP 파이프라인 전체 시스템 구성도</title>
<desc id="desc">뉴스와 Reddit 수집에서 Spark, MinIO, OpenAI Batch, PostgreSQL, Langfuse, Slack, Streamlit까지 이어지는 현재 배치 경로와 Kafka Structured Streaming 재생 경로</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#596579"/></marker>
  <marker id="accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#e86c34"/></marker>
  <marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3974aa"/></marker>
  <marker id="red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#c84d49"/></marker>
</defs>
<rect width="1500" height="700" fill="#f4f5f7"/>

<!-- shared source and contract -->
<rect class="source" x="28" y="86" width="150" height="66" rx="7"/>
<text class="label" x="41" y="104">NEWS</text><text class="name" x="103" y="126" text-anchor="middle">Google News</text><text class="sub" x="103" y="142" text-anchor="middle">Global Voices 보완</text>
<rect class="source" x="28" y="166" width="150" height="66" rx="7"/>
<text class="label" x="41" y="184">COMMENTS</text><text class="name" x="103" y="206" text-anchor="middle">Reddit Archive</text><text class="sub" x="103" y="222" text-anchor="middle">선정 subreddit</text>
<rect class="node" x="214" y="126" width="142" height="66" rx="7"/>
<text class="label" x="227" y="144">COLLECT</text><text class="name" x="285" y="166" text-anchor="middle">Collectors</text><text class="sub" x="285" y="182" text-anchor="middle">날짜 · 대주제 입력</text>
<rect class="process" x="392" y="126" width="150" height="66" rx="7"/>
<text class="label" x="405" y="144">CONTRACT</text><text class="name" x="467" y="166" text-anchor="middle">TextEvent v1</text><text class="sub" x="467" y="182" text-anchor="middle">표준화 · 품질 검사</text>
<path class="arrow" d="M178 119H198V147H214"/><path class="arrow" d="M178 199H198V171H214"/><path class="arrow" d="M356 159H392"/>

<!-- batch lane -->
<rect class="lane lane-batch" x="28" y="270" width="1444" height="214" rx="12"/>
<text class="lane-title" x="50" y="296">현재 발표·운영 배치 경로</text><text class="lane-sub" x="50" y="312">Airflow DAG 한 번으로 날짜별 mapped task 실행</text>

<rect class="process" x="58" y="344" width="132" height="72" rx="7"/>
<text class="label" x="71" y="362">PROCESS</text><text class="name" x="124" y="384" text-anchor="middle">Spark Batch</text><text class="sub" x="124" y="400" text-anchor="middle">검사 · dedup · Parquet</text>
<rect class="store" x="226" y="344" width="132" height="72" rx="7"/>
<text class="label" x="239" y="362">OBJECT STORAGE</text><text class="name" x="292" y="384" text-anchor="middle">MinIO</text><text class="sub" x="292" y="400" text-anchor="middle">raw · processed · LLM · report</text>
<rect class="process" x="394" y="344" width="148" height="72" rx="7"/>
<text class="label" x="407" y="362">PREFLIGHT</text><text class="name" x="468" y="384" text-anchor="middle">그룹별 요청 생성</text><text class="sub" x="468" y="400" text-anchor="middle">뉴스 50% · 댓글 50%</text>
<rect class="node" x="578" y="344" width="144" height="72" rx="7"/>
<text class="label" x="591" y="362">ASYNC BATCH</text><text class="name" x="650" y="384" text-anchor="middle">GPT-5.6 Luna</text><text class="sub" x="650" y="400" text-anchor="middle">감정 · tone · topic</text>
<rect class="process" x="758" y="344" width="140" height="72" rx="7"/>
<text class="label" x="771" y="362">QUALITY GATE</text><text class="name" x="828" y="384" text-anchor="middle">v3 결과 검증</text><text class="sub" x="828" y="400" text-anchor="middle">정규화 · 누락 검사</text>
<rect class="store" x="934" y="344" width="132" height="72" rx="7"/>
<text class="label" x="947" y="362">FINAL STORE</text><text class="name" x="1000" y="384" text-anchor="middle">PostgreSQL</text><text class="sub" x="1000" y="400" text-anchor="middle">멱등 upsert</text>
<rect class="node" x="1102" y="326" width="132" height="64" rx="7"/>
<text class="label" x="1115" y="344">SERVING</text><text class="name" x="1168" y="365" text-anchor="middle">Streamlit</text><text class="sub" x="1168" y="380" text-anchor="middle">v3 기본 조회</text>
<rect class="node" x="1102" y="402" width="132" height="58" rx="7"/>
<text class="label" x="1115" y="420">ALERT</text><text class="name" x="1168" y="440" text-anchor="middle">Slack 완료 알림</text><text class="sub" x="1168" y="454" text-anchor="middle">날짜 · 감정 · topic</text>
<rect class="observe" x="1270" y="344" width="164" height="72" rx="7"/>
<text class="label" x="1283" y="362">OBSERVABILITY</text><text class="name" x="1352" y="384" text-anchor="middle">Langfuse</text><text class="sub" x="1352" y="400" text-anchor="middle">token · 비용 · fallback</text>

<path class="batch-flow" d="M467 192V246H124V344"/>
<path class="batch-flow" d="M190 380H226"/><path class="batch-flow" d="M358 380H394"/><path class="batch-flow" d="M542 380H578"/><path class="batch-flow" d="M722 380H758"/><path class="batch-flow" d="M898 380H934"/>
<path class="arrow" d="M1066 372H1102"/><path class="arrow" d="M1066 396H1082V431H1102"/><path class="control-flow" d="M722 365H744V326H1352V344"/>

<!-- Airflow control -->
<rect class="control" x="58" y="438" width="840" height="32" rx="6"/>
<text class="name" x="78" y="459">Airflow</text><text class="sub" x="140" y="459">날짜 범위 · 1~4개 대주제 · 동시 Batch 수 · retry · 실행 이력</text>
<path class="control-flow" d="M478 438V422"/>

<!-- streaming lane -->
<rect class="lane lane-stream" x="28" y="518" width="1444" height="128" rx="12"/>
<text class="lane-title" x="50" y="544">독립 검증된 Kafka 재생·스트리밍 경로</text><text class="lane-sub" x="50" y="560">실시간·저장 이벤트 replay용이며 현재 최종 Airflow DAG의 직렬 단계는 아님</text>
<rect class="store" x="245" y="576" width="128" height="54" rx="7"/>
<text class="name" x="309" y="599" text-anchor="middle">JSONL staging</text><text class="sub" x="309" y="616" text-anchor="middle">재생 가능한 입력</text>
<rect class="node" x="421" y="576" width="128" height="54" rx="7"/>
<text class="name" x="485" y="599" text-anchor="middle">Kafka raw-text</text><text class="sub" x="485" y="616" text-anchor="middle">producer · event key</text>
<rect class="process" x="597" y="576" width="160" height="54" rx="7"/>
<text class="name" x="677" y="599" text-anchor="middle">Structured Streaming</text><text class="sub" x="677" y="616" text-anchor="middle">watermark · checkpoint</text>
<rect class="store" x="805" y="576" width="150" height="54" rx="7"/>
<text class="name" x="880" y="599" text-anchor="middle">MinIO · PostgreSQL</text><text class="sub" x="880" y="616" text-anchor="middle">4개 품질 경로</text>
<rect class="error-node" x="1003" y="576" width="128" height="54" rx="7"/>
<text class="name" x="1067" y="599" text-anchor="middle">Kafka DLQ</text><text class="sub" x="1067" y="616" text-anchor="middle">계약·파싱 실패</text>
<path class="stream-flow" d="M467 192V502H309V576"/><path class="stream-flow" d="M373 603H421"/><path class="stream-flow" d="M549 603H597"/><path class="stream-flow" d="M757 603H805"/>
<path class="error-flow" d="M757 617H780V637H980V603H1003"/>

<!-- legend -->
<g transform="translate(470 678)"><line x1="0" y1="0" x2="32" y2="0" stroke="#e86c34" stroke-width="1.55"/><text class="legend" x="40" y="3">현재 배치 흐름</text><line x1="151" y1="0" x2="183" y2="0" stroke="#3974aa" stroke-width="1.35"/><text class="legend" x="191" y="3">스트리밍·제어</text><line x1="310" y1="0" x2="342" y2="0" stroke="#c84d49" stroke-width="1.3" stroke-dasharray="3 3"/><text class="legend" x="350" y="3">오류 흐름</text></g>
</svg>
<p class="note"><b>현재 상태 기준.</b> 주황색은 실제 발표용 end-to-end 배치, 파란색은 독립 검증한 Kafka 경로와 제어, 빨간 점선은 오류입니다. Airflow는 데이터가 마지막에 통과하는 처리기가 아니라 배치 경로 전체를 제어하는 orchestration 계층입니다. 아직 구현하지 않은 확장은 이 구성도에 포함하지 않습니다.</p>
</main></body></html>
