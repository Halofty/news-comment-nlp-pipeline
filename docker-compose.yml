services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: news-pipeline-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16.10
    container_name: news-pipeline-postgres
    environment:
      POSTGRES_DB: news_pipeline
      POSTGRES_USER: news_pipeline
      POSTGRES_PASSWORD: news_pipeline_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_pipeline -d news_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.7-python3
    container_name: news-pipeline-spark-master
    user: "0:0"
    working_dir: /opt/spark/work-dir
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - .:/opt/spark/work-dir
      - spark-ivy:/root/.ivy2
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.7-python3
    container_name: news-pipeline-spark-worker
    user: "0:0"
    working_dir: /opt/spark/work-dir
    environment:
      PYTHONPATH: /opt/spark/work-dir
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_WEBUI_PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - .:/opt/spark/work-dir
      - spark-ivy:/root/.ivy2
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "http://127.0.0.1:8081"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  spark-runner:
    image: news-pipeline-spark:3.5.7-python3
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    profiles: ["tools"]
    user: "0:0"
    working_dir: /opt/spark/work-dir
    environment:
      PYTHONPATH: /opt/spark/work-dir
      SPARK_MASTER_URL: spark://spark-master:7077
      POSTGRES_DSN: postgresql://news_pipeline:news_pipeline_dev@postgres:5432/news_pipeline
    volumes:
      - .:/opt/spark/work-dir
      - spark-ivy:/root/.ivy2
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["--version"]

volumes:
  kafka-data:
  postgres-data:
  spark-ivy:

