services:
  airflow:
    build:
      context: ../..
      dockerfile: infra/airflow/Dockerfile
    image: news-pipeline-airflow:3.3.1
    container_name: news-pipeline-airflow
    user: "${AIRFLOW_UID:-1000}:0"
    command: python /opt/airflow/project/infra/airflow/start_standalone.py
    working_dir: /opt/airflow/project
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /home/airflow/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAG_RUN_CONF_OVERRIDES_PARAMS: "true"
      PYTHONPATH: /opt/airflow/project
      AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:-admin}"
      AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:-news_pipeline_airflow_dev}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "${KAFKA_RAW_TOPIC:-raw-text}"
      KAFKA_DLQ_TOPIC: "${KAFKA_DLQ_TOPIC:-raw-text-dlq}"
      # The runtime UID follows the host for bind-mount permissions and may not
      # have a passwd entry inside the image. Hadoop needs a stable user name.
      HADOOP_USER_NAME: airflow
      SPARK_IVY_DIR: "/home/airflow/.ivy2"
      MINIO_ENDPOINT: "${MINIO_AIRFLOW_ENDPOINT:-http://host.docker.internal:9002}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-news_pipeline}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-news_pipeline_minio_dev}"
      MINIO_RAW_BUCKET: "${MINIO_RAW_BUCKET:-news-raw}"
      MINIO_PROCESSED_BUCKET: "${MINIO_PROCESSED_BUCKET:-news-processed}"
      MINIO_LLM_BUCKET: "${MINIO_LLM_BUCKET:-news-llm}"
      MINIO_REPORTS_BUCKET: "${MINIO_REPORTS_BUCKET:-news-reports}"
      MINIO_CHECKPOINT_BUCKET: "${MINIO_CHECKPOINT_BUCKET:-news-checkpoints}"
      POSTGRES_DSN: "${POSTGRES_AIRFLOW_DSN:-postgresql://news_pipeline:news_pipeline_dev@host.docker.internal:5432/news_pipeline}"
      PIPELINE_STORAGE_BACKEND: minio
      PIPELINE_DATA_ROOT: /opt/airflow/project/data
    ports:
      - "8082:8080"
    volumes:
      - ../..:/opt/airflow/project
      - ../../data/airflow-home:/home/airflow/.airflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

networks:
  default:
    name: news-comment-nlp-pipeline_default
    external: true
