services:
  airflow:
    build:
      context: ../..
      dockerfile: infra/airflow/Dockerfile
    image: news-pipeline-airflow:3.3.1
    container_name: news-pipeline-airflow
    user: "${AIRFLOW_UID:-1000}:0"
    command: standalone
    working_dir: /opt/airflow/project
    environment:
      AIRFLOW_HOME: /home/airflow/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAG_RUN_CONF_OVERRIDES_PARAMS: "true"
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8082:8080"
    volumes:
      - ../..:/opt/airflow/project
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
