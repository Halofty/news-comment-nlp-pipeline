_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: News Pipeline Batch Notifier
  description: OpenAI Batch 완료 상태와 주요 topic을 파이프라인 채널에 알립니다.
  background_color: "#2D3142"

features:
  bot_user:
    display_name: News Pipeline Batch Notifier
    always_online: false

oauth_config:
  scopes:
    bot:
      - incoming-webhook

settings:
  incoming_webhooks:
    incoming_webhooks_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
